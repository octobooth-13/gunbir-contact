<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gunbir Singh - Contact Card</title>
<meta name="description" content="Gunbir Singh - Founder of CloudForge. GitHub, LinkedIn and contact details.">
<meta name="theme-color" content="#0d1117">
<meta property="og:title" content="Gunbir Singh">
<meta property="og:description" content="Founder @ CloudForge">
<meta property="og:image" content="https://github.com/devgunnu.png">
<link rel="icon" href="https://github.com/devgunnu.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --text: #f0f6fc;
    --muted: #8b949e;
    --purple: #583af7;
    --blue: #168ffb;
    --green: #0fbf3e;
    --pink: #f73678;
    --orange: #ff7a30;
    --amber: #ffc861;
    --mx: 30%;
    --my: 15%;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 24px 16px;
    overflow-x: hidden;
  }
  .defs { position: absolute; width: 0; height: 0; overflow: hidden; }

  .blob {
    position: fixed; border-radius: 50%; filter: blur(80px); opacity: .45; z-index: 0;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .blob.a { width: 360px; height: 360px; background: var(--purple); top: -120px; left: -100px; }
  .blob.b { width: 300px; height: 300px; background: var(--blue); bottom: -120px; right: -80px; animation-delay: -6s; }
  .blob.c { width: 220px; height: 220px; background: var(--orange); top: 45%; left: 60%; opacity: .25; animation-delay: -12s; }
  @keyframes drift { to { transform: translate(40px, 60px) scale(1.15); } }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px;
    padding: 2px; border-radius: 28px;
    background: conic-gradient(from var(--angle), var(--purple), var(--blue), var(--green), var(--pink), var(--purple));
    animation: spin 6s linear infinite;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
  }
  @property --angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  @keyframes spin { to { --angle: 360deg; } }
  .inner {
    border-radius: 26px;
    background-color: rgba(13, 17, 23, .94);
    padding: 32px 24px 24px;
    text-align: center;
  }

  /* Subtle liquid glass for links and buttons: frosted fill, bright top rim, light that follows the pointer. */
  .glass {
    position: relative;
    isolation: isolate;
    background: linear-gradient(135deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .03));
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, .09);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
  }
  .glass::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
    background: radial-gradient(120% 90% at var(--mx) var(--my), rgba(255, 255, 255, .06), transparent 45%);
  }

  .avatar {
    width: 116px; height: 116px; border-radius: 50%;
    padding: 4px; margin: 0 auto 18px;
    background: linear-gradient(135deg, var(--purple), var(--blue), var(--orange));
  }
  .avatar img {
    width: 100%; height: 100%; border-radius: 50%; display: block;
    border: 4px solid var(--bg); object-fit: cover; background: #161b22;
  }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .handle { color: var(--muted); margin-top: 4px; font-size: 15px; }

  .fire-text {
    background: linear-gradient(90deg, var(--amber), var(--orange), var(--pink), var(--amber));
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: shimmer 4s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% center; } }

  .role {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 14px; padding: 6px 14px; border-radius: 999px;
    color: var(--text); font-weight: 600; font-size: 13px; text-decoration: none;
  }
  .bio { color: #c9d1d9; font-size: 14px; line-height: 1.5; margin: 16px auto 0; max-width: 300px; }
  .bio:empty { display: none; }

  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.6s ease-in-out infinite; }
  @keyframes flicker {
    25% { transform: scaleY(1.06) skewX(-2deg); }
    50% { transform: scaleY(.96); }
    75% { transform: scaleY(1.04) skewX(2deg); }
  }

  .links { display: grid; gap: 10px; margin-top: 24px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px 12px 12px; border-radius: 18px;
    color: var(--text); text-decoration: none; text-align: left;
    transition: transform .2s ease, border-color .2s ease;
  }
  .link:hover, .link:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  /* Frosted icon tile tinted with the link's accent colour. */
  .icon {
    position: relative; overflow: hidden;
    width: 42px; height: 42px; border-radius: 13px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 70%, rgba(255, 255, 255, .15)), color-mix(in srgb, var(--accent) 40%, transparent));
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, .16);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .2),
      0 4px 14px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .icon::after, button::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(rgba(255, 255, 255, .1), rgba(255, 255, 255, 0) 60%);
  }
  .icon.logo {
    background: linear-gradient(160deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .03));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .15),
      0 4px 14px rgba(255, 122, 48, .25);
  }
  .icon.logo svg { width: 34px; height: 34px; fill: initial; }
  .icon svg { width: 22px; height: 22px; fill: #fff; position: relative; }
  .label { font-weight: 700; font-size: 15px; }
  .sub { color: var(--muted); font-size: 13px; }
  .arrow { margin-left: auto; color: var(--muted); font-size: 18px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  button {
    font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
    padding: 14px; border-radius: 999px; color: #fff;
    overflow: hidden;
    transition: transform .2s ease, filter .2s ease;
  }
  button:hover { transform: translateY(-2px); filter: brightness(1.12); }
  .primary {
    background: linear-gradient(135deg, rgba(88, 58, 247, .65), rgba(22, 143, 251, .55));
    border-color: rgba(255, 255, 255, .14);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 6px 18px rgba(88, 58, 247, .25);
  }

  footer { margin-top: 20px; color: var(--muted); font-size: 12px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 90px);
    padding: 10px 18px; border-radius: 999px;
    font-size: 14px; transition: transform .3s ease; z-index: 2;
  }
  .toast.show { transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
  <svg class="defs" aria-hidden="true">
    <defs>
      <linearGradient id="cf-cloud" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffc861"/>
        <stop offset=".5" stop-color="#ff7a30"/>
        <stop offset="1" stop-color="#ff3d8b"/>
      </linearGradient>
      <linearGradient id="cf-flame" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#ffe3b0"/>
      </linearGradient>
      <!-- CloudForge mark: a cloud with a forge flame burning inside it -->
      <symbol id="cf-logo" viewBox="0 0 48 48">
        <path d="M13.5 36A8.5 8.5 0 0 1 12.6 19.05A11.5 11.5 0 0 1 34.6 16.9A9.6 9.6 0 0 1 35 36Z" fill="url(#cf-cloud)"/>
        <path d="M13.5 36A8.5 8.5 0 0 1 12.6 19.05A11.5 11.5 0 0 1 34.6 16.9A9.6 9.6 0 0 1 35 36Z" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1"/>
        <path class="flame" d="M24 17.5c3.6 4.2 7 7.2 7 11.6a7 7 0 0 1-14 0c0-2.6 1.2-4.5 2.8-5.9.2 2.1 1.2 3.5 2.7 4.1-.6-3.6.1-6.9 1.5-9.8z" fill="url(#cf-flame)"/>
        <path class="flame" d="M24 27.5c1.6 1.8 3 3 3 4.8a3 3 0 0 1-6 0c0-1.5 1.2-3 3-4.8z" fill="#ff7a30"/>
      </symbol>
    </defs>
  </svg>

  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>

  <main class="card">
    <div class="inner">
      <div class="avatar"><img src="https://github.com/devgunnu.png?size=240" alt="Gunbir Singh"></div>
      <h1 id="name">Gunbir Singh</h1>
      <div class="handle">@devgunnu</div>
      <a class="role glass" href="https://www.trycloudforge.com" target="_blank" rel="noopener">
        <span>Founder @ <b class="fire-text">CloudForge</b></span>
      </a>
      <p class="bio" id="bio"></p>

      <nav class="links">
        <a class="link glass" style="--accent: var(--orange)" href="https://www.trycloudforge.com" target="_blank" rel="noopener">
          <span class="icon logo"><svg><use href="#cf-logo"/></svg></span>
          <span><div class="label fire-text">CloudForge</div><div class="sub">trycloudforge.com</div></span>
          <span class="arrow">&rarr;</span>
        </a>
        <a class="link glass" style="--accent: var(--blue)" href="https://www.linkedin.com/in/gunbirsingh" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg></span>
          <span><div class="label">LinkedIn</div><div class="sub">in/gunbirsingh</div></span>
          <span class="arrow">&rarr;</span>
        </a>
        <a class="link glass" style="--accent: var(--purple)" href="https://github.com/devgunnu" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.6 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.2.8.8 1.3 1.9 1.3 3.1 0 4.7-2.8 5.7-5.5 6 .4.3.8 1 .8 2v3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg></span>
          <span><div class="label">GitHub</div><div class="sub">github.com/devgunnu</div></span>
          <span class="arrow">&rarr;</span>
        </a>
      </nav>

      <div class="actions">
        <button class="glass primary" id="save">Save contact</button>
        <button class="glass" id="share">Share</button>
      </div>
      <footer>Scanned from my GitHub Universe badge</footer>
    </div>
  </main>

  <div class="toast glass" id="toast"></div>

<script>
  const root = document.documentElement;

  const setLight = (x, y) => {
    root.style.setProperty("--mx", `${Math.max(0, Math.min(100, x))}%`);
    root.style.setProperty("--my", `${Math.max(0, Math.min(100, y))}%`);
  };
  addEventListener("pointermove", (e) => setLight((e.clientX / innerWidth) * 100, (e.clientY / innerHeight) * 100));
  addEventListener("deviceorientation", (e) => {
    if (e.gamma !== null) setLight(50 + e.gamma * 1.5, 50 + (e.beta - 45) * 1.5);
  });

  const CONTACT = {
    name: "Gunbir Singh",
    first: "Gunbir",
    last: "Singh",
    org: "CloudForge",
    title: "Founder",
    github: "devgunnu",
    linkedin: "https://www.linkedin.com/in/gunbirsingh",
    website: "https://www.trycloudforge.com",
  };

  const toast = (message) => {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 2200);
  };

  // Live bio from the public GitHub API; the card still works if this fails.
  fetch(`https://api.github.com/users/${CONTACT.github}`)
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((user) => {
      if (user.bio) document.getElementById("bio").textContent = user.bio;
    })
    .catch(() => {});

  async function photoBase64() {
    try {
      const blob = await (await fetch(`https://github.com/${CONTACT.github}.png?size=240`)).blob();
      const data = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
      return data.split(",")[1];
    } catch {
      return null;
    }
  }

  document.getElementById("save").addEventListener("click", async () => {
    const photo = await photoBase64();
    const lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      `N:${CONTACT.last};${CONTACT.first};;;`,
      `FN:${CONTACT.name}`,
      `ORG:${CONTACT.org}`,
      `TITLE:${CONTACT.title}`,
      `URL;TYPE=Work:${CONTACT.website}`,
      `URL;TYPE=LinkedIn:${CONTACT.linkedin}`,
      `URL;TYPE=GitHub:https://github.com/${CONTACT.github}`,
      "NOTE:Met via my GitHub Universe badge",
    ];
    if (photo) lines.push(`PHOTO;ENCODING=b;TYPE=PNG:${photo}`);
    lines.push("END:VCARD");
    const url = URL.createObjectURL(new Blob([lines.join("\r\n")], { type: "text/vcard" }));
    const a = Object.assign(document.createElement("a"), { href: url, download: "gunbir-singh.vcf" });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Contact downloaded");
  });

  document.getElementById("share").addEventListener("click", async () => {
    const data = { title: CONTACT.name, text: `${CONTACT.name} - ${CONTACT.title} @ ${CONTACT.org}`, url: location.href };
    if (navigator.share) {
      try { await navigator.share(data); } catch {}
    } else {
      await navigator.clipboard.writeText(location.href);
      toast("Link copied");
    }
  });
</script>
</body>
</html>
